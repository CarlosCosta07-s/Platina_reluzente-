name: Mobile renderer shader source validation (host only)

on:
  push:
    branches: [main]
    paths:
      - "mobile/renderer/gles300/**"
      - "tools/validate_mobile_renderer_shaders.py"
      - "scripts/prepare_mobile_renderer.py"
      - "tools/tests/test_mobile_renderer_sources.py"
      - "tools/tests/test_prepare_mobile_renderer.py"
      - "tools/tests/cpp/**"
      - ".github/workflows/mobile-shader-source-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-shader-host-validation-main
  cancel-in-progress: true

jobs:
  host-glsl-validation:
    name: GLSL ES 3.00 compile/link on Linux host
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run ROM-free shader source contract tests
        run: python tools/tests/test_mobile_renderer_sources.py

      - name: Test fail-closed mobile renderer source preparation
        run: python tools/tests/test_prepare_mobile_renderer.py

      - name: Fetch the exact pinned libntr source revision
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/cybervisi0n/libntr.git "$RUNNER_TEMP/libntr-mobile-source"
          git -C "$RUNNER_TEMP/libntr-mobile-source" checkout --detach 1555d911ac80c0190ac1c321f99f1323de8b3c09

      - name: Apply mobile renderer source patch to pinned libntr (host-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/prepare_mobile_renderer.py "$RUNNER_TEMP/libntr-mobile-source"
          python scripts/prepare_mobile_renderer.py "$RUNNER_TEMP/libntr-mobile-source"

      - name: Install host GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslang-tools

      - name: Compile and link GLES shaders on host only
        run: python tools/validate_mobile_renderer_shaders.py
