name: Desktop launcher packages for manual testing

concurrency:
  group: desktop-launcher-packages-v1-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

on:
  workflow_run:
    workflows:
      - Native desktop build and localization checks
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  verify-desktop-build:
    name: Require successful Windows and Linux native builds
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
      desktop_run_id: ${{ steps.verify.outputs.desktop_run_id }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
    steps:
      - name: Verify desktop build completion
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.name !== 'Native desktop build and localization checks' ||
                run.head_branch !== 'main' ||
                run.status !== 'completed' ||
                run.conclusion !== 'success') {
              core.setFailed('Desktop packages require successful Windows and Linux native builds from main.');
              return;
            }
            core.setOutput('head_sha', run.head_sha);
            core.setOutput('desktop_run_id', String(run.id));
            core.setOutput('ready', 'true');
            core.info('Packaging desktop launchers from verified native build ' + run.id +
              ' at commit ' + run.head_sha + '. Android is packaged separately after its native build succeeds.');

  launcher-source-checks:
    name: Launcher source checks
    needs: verify-desktop-build
    if: ${{ needs.verify-desktop-build.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-desktop-build.outputs.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install launcher dependencies
        working-directory: launcher-app
        run: npm install --no-audit --no-fund
      - name: Run launcher tests
        working-directory: launcher-app
        run: npm test

  windows:
    name: Windows launcher with bundled native runtime
    needs: [verify-desktop-build, launcher-source-checks]
    if: ${{ needs.verify-desktop-build.outputs.ready == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-desktop-build.outputs.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Download native Windows runtime
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-desktop-build.outputs.desktop_run_id }}
          name: platina-reluzente-windows-x64
          path: launcher-app/runtime
      - name: Verify executable and stamp runtime version
        shell: pwsh
        env:
          RUNTIME_BUILD_ID: ${{ needs.verify-desktop-build.outputs.head_sha }}
        run: |
          if (-not (Test-Path 'launcher-app/runtime/main.exe')) { throw 'main.exe missing; refusing to package a launcher that asks users to select an executable.' }
          Set-Content -NoNewline -Encoding ascii -Path 'launcher-app/runtime/launcher-runtime-version.txt' -Value $env:RUNTIME_BUILD_ID
      - name: Install launcher dependencies
        working-directory: launcher-app
        run: npm install --no-audit --no-fund
      - name: Build complete Windows launcher
        working-directory: launcher-app
        run: npm run build:windows
      - name: Upload Windows launcher for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: platina-reluzente-windows-x64-desktop-complete
          path: launcher-app/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux launcher with bundled native runtime
    needs: [verify-desktop-build, launcher-source-checks]
    if: ${{ needs.verify-desktop-build.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-desktop-build.outputs.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Download native Linux runtime archive
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-desktop-build.outputs.desktop_run_id }}
          name: platina-reluzente-linux-x86_64
          path: launcher-app/runtime-archive
      - name: Extract and verify included executable
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p launcher-app/runtime
          tar -xzf launcher-app/runtime-archive/Platina-Reluzente-Linux-x86_64.tar.gz -C launcher-app/runtime
          test -s launcher-app/runtime/main
          chmod +x launcher-app/runtime/main
          test -x launcher-app/runtime/main
          printf '%s\n' '${{ needs.verify-desktop-build.outputs.head_sha }}' > launcher-app/runtime/launcher-runtime-version.txt
      - name: Install launcher dependencies
        working-directory: launcher-app
        run: npm install --no-audit --no-fund
      - name: Build complete Linux launcher
        working-directory: launcher-app
        run: npm run build:linux
      - name: Upload Linux launcher for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: platina-reluzente-linux-x86_64-desktop-complete
          path: launcher-app/dist/*
          if-no-files-found: error
          retention-days: 14
