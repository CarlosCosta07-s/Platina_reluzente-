name: Native desktop build and localization checks

concurrency:
  group: native-desktop-v4-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-desktop.yml"
      - ".gitmodules"
      - "scripts/**"
      - "tools/**"
      - "vendor/**"
      - "launcher-app/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  NATIVE_SOURCE_COMMIT: 35067868f64f23d25d17ac3e536cfdd9a7f40523
  NATIVE_SOURCE_URL: https://github.com/cybervisi0n/pokeplatinum.git

jobs:
  localization-importer:
    name: Importer and dependency-pinning unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m py_compile tools/localization_manifest.py tools/import_localization.py tools/check_runtime_data.py scripts/pin_native_dependencies.py scripts/verify_native_package.py tools/tests/test_import_localization.py tools/tests/test_check_runtime_data.py tools/tests/test_pin_native_dependencies.py tools/tests/test_verify_native_package.py scripts/prepare_native_runtime.py tools/tests/test_prepare_native_runtime.py

      - name: Run unit tests
        run: |
          python -m unittest discover -s tools/tests -v
          python -m unittest tools.tests.test_prepare_native_runtime -v

      - name: Validate native Linux smoke-test shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in scripts/smoke-test-native-startup.sh scripts/build-native.sh; do
            bash -n "$script"
          done

  linux:
    name: Linux x86-64 compile
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LM_LICENSE_FILE: ${{ github.workspace }}/vendor/pokeplatinum-native/tools/cw/license.dat
      BUILD: /var/tmp/pokeplatinum
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Checkout pinned native source with standalone Git metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          native_dir="$GITHUB_WORKSPACE/vendor/pokeplatinum-native"
          rm -rf "$native_dir"
          mkdir -p "$native_dir"
          git -C "$native_dir" init
          git -C "$native_dir" remote add origin "$NATIVE_SOURCE_URL"
          git -C "$native_dir" fetch --depth=1 origin "$NATIVE_SOURCE_COMMIT"
          git -C "$native_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$native_dir" rev-parse HEAD)" = "$NATIVE_SOURCE_COMMIT"
      - name: Pin Meson dependency commits
        run: python "$GITHUB_WORKSPACE/scripts/pin_native_dependencies.py" "$GITHUB_WORKSPACE/vendor/pokeplatinum-native"
      - name: Install runner utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse git python3 wget zip xvfb xauth xdotool
      - name: Install build toolchain
        working-directory: vendor/pokeplatinum-native
        run: ./drun.sh make skrew
      - name: Prepare Meson subprojects and ROM-header handoff
        working-directory: vendor/pokeplatinum-native
        shell: bash
        run: |
          set -Eeuo pipefail
          ./drun.sh make meson
          python3 subprojects/meson-1.12.0/meson.py subprojects download --sourcedir "$PWD"
          python3 "$GITHUB_WORKSPACE/scripts/prepare_native_runtime.py" "$PWD"
      - name: Compile native Linux target
        working-directory: vendor/pokeplatinum-native
        run: ./drun.sh make linux
      - name: Verify complete Linux runtime package
        run: python "$GITHUB_WORKSPACE/scripts/verify_native_package.py" --build-dir "$GITHUB_WORKSPACE/vendor/pokeplatinum-native/build_linux" --package-dir "$GITHUB_WORKSPACE/vendor/pokeplatinum-native/build_linux/pokeplatinum" --filesys-csv "$GITHUB_WORKSPACE/vendor/pokeplatinum-native/platinum.us/filesys.csv"
      - name: Locate generated Linux AppImage
        id: linux_appimage
        shell: bash
        run: |
          set -Eeuo pipefail
          build_root="$GITHUB_WORKSPACE/vendor/pokeplatinum-native/build_linux"
          mapfile -t appimages < <(find "$build_root" -maxdepth 5 -type f -name '*.AppImage' -print)
          if [[ "${#appimages[@]}" -ne 1 ]]; then
            echo "Expected exactly one AppImage under $build_root; found ${#appimages[@]}." >&2
            find "$build_root" -maxdepth 5 -type f -name '*.AppImage' -print || true
            exit 1
          fi
          appimage="${appimages[0]}"
          if [[ ! -x "$appimage" ]]; then
            echo "Generated AppImage is not executable: $appimage" >&2
            ls -l -- "$appimage" || true
            exit 1
          fi
          printf 'path=%s\n' "$appimage" >> "$GITHUB_OUTPUT"
          echo "AppImage found: $appimage"

      - name: Smoke-test Linux first-launch UI without a ROM
        env:
          APPIMAGE_PATH: ${{ steps.linux_appimage.outputs.path }}
        run: bash "$GITHUB_WORKSPACE/scripts/smoke-test-native-startup.sh" "$APPIMAGE_PATH" 15

      - name: Prepare Linux native artifact and path-only data manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="$RUNNER_TEMP/Platina-Reluzente-Linux-x86_64-native-artifact"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          appimage="${{ steps.linux_appimage.outputs.path }}"
          install -m 0755 "$appimage" "$artifact_dir/$(basename "$appimage")"
          node "$GITHUB_WORKSPACE/launcher-app/scripts/create-data-path-manifest.cjs" \
            --input "$GITHUB_WORKSPACE/vendor/pokeplatinum-native/platinum.us/filesys.csv" \
            --output "$artifact_dir/platinum-data-paths.txt"
          test -s "$artifact_dir/platinum-data-paths.txt"
          printf 'Prepared AppImage plus a path-only manifest. No ROM or extracted game asset is included.\\n'

      - name: Upload Linux native runtime and path manifest (no game data)
        uses: actions/upload-artifact@v4
        with:
          name: Platina-Reluzente-Linux-x86_64-AppImage
          path: ${{ runner.temp }}/Platina-Reluzente-Linux-x86_64-native-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Restore Meson dependency references
        if: always()
        run: python "$GITHUB_WORKSPACE/scripts/pin_native_dependencies.py" --restore "$GITHUB_WORKSPACE/vendor/pokeplatinum-native"

      - name: Set up Node.js for Linux launcher
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install Linux launcher dependencies
        working-directory: launcher-app
        run: npm install --no-audit --no-fund
      - name: Test Linux launcher before packaging
        working-directory: launcher-app
        run: npm test
      - name: Build integrated Linux launcher
        working-directory: launcher-app
        run: npm run build:linux
      - name: Stage Linux launcher artifacts without game data
        shell: bash
        run: |
          set -Eeuo pipefail
          dist_dir="$GITHUB_WORKSPACE/launcher-app/dist"
          stage_dir="$RUNNER_TEMP/Platina-Reluzente-Launcher-Linux-x64"
          mapfile -t appimages < <(find "$dist_dir" -maxdepth 1 -type f -name 'Platina-Reluzente-Launcher-*.AppImage' -print)
          mapfile -t archives < <(find "$dist_dir" -maxdepth 1 -type f -name 'Platina-Reluzente-Launcher-*-linux-x64.tar.gz' -print)
          if [[ "${#appimages[@]}" -ne 1 || "${#archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one Linux launcher AppImage and tar.gz; found ${#appimages[@]} AppImage(s), ${#archives[@]} archive(s)." >&2
            find "$dist_dir" -maxdepth 1 -type f -print || true
            exit 1
          fi
          rm -rf "$stage_dir"
          mkdir -p "$stage_dir"
          cp -- "${appimages[0]}" "${archives[0]}" "$stage_dir/"
          cat > "$stage_dir/README-FIRST-START.txt" <<'EOF'
          Platina Reluzente Launcher - Linux x86-64 test build

          This is a native desktop launcher package. Its game runtime is compiled
          native code and bundled libraries; no ROM, firmware, extracted NARC,
          game save, or patch is included.

          Import only a legally obtained compatible Pokemon Platinum USA Rev. 1
          .nds image through the launcher. The current loader checks the full
          image SHA-1 and rejects unsupported revisions. Missing data is meant
          to be extracted locally from the imported ROM on first launch.

          This is an experimental test build. CI confirmed the native Linux
          window can open without a ROM, but has not confirmed title-screen
          startup or gameplay with a ROM. Please report any failure and attach
          the private native-startup.log; do not upload ROMs or extracted data.
          EOF
          (cd "$stage_dir" && sha256sum *.AppImage *.tar.gz README-FIRST-START.txt > SHA256SUMS.txt)
          ls -lh "$stage_dir"
      - name: Upload integrated Linux launcher
        uses: actions/upload-artifact@v4
        with:
          name: Platina-Reluzente-Launcher-Linux-x64
          path: ${{ runner.temp }}/Platina-Reluzente-Launcher-Linux-x64/
          if-no-files-found: error
          retention-days: 14


  windows:
    name: Windows x64 compile
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Checkout pinned native source with standalone Git metadata
        shell: pwsh
        run: |
          $nativeDir = Join-Path $env:GITHUB_WORKSPACE "vendor/pokeplatinum-native"
          if (Test-Path $nativeDir) {
            Remove-Item -Recurse -Force $nativeDir
          }
          New-Item -ItemType Directory -Path $nativeDir -Force | Out-Null
          git -C $nativeDir init
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $nativeDir remote add origin $env:NATIVE_SOURCE_URL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $nativeDir fetch --depth=1 origin $env:NATIVE_SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $nativeDir checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (git -C $nativeDir rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:NATIVE_SOURCE_COMMIT) {
            throw "Native source commit mismatch. Expected $env:NATIVE_SOURCE_COMMIT; got $actual"
          }
      - name: Pin Meson dependency commits
        shell: pwsh
        run: |
          python (Join-Path $env:GITHUB_WORKSPACE "scripts/pin_native_dependencies.py") (Join-Path $env:GITHUB_WORKSPACE "vendor/pokeplatinum-native")
      - name: Install MSYS2 build environment
        working-directory: vendor/pokeplatinum-native
        run: .\Install_MSys2.ps1
        shell: powershell
      - name: Prepare Meson subprojects and ROM-header handoff
        working-directory: vendor/pokeplatinum-native
        shell: pwsh
        run: |
          .\Launch_MSys2.ps1 "make meson"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\Launch_MSys2.ps1 "python subprojects/meson-1.12.0/meson.py subprojects download --sourcedir ."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $env:GITHUB_WORKSPACE "scripts/prepare_native_runtime.py") (Get-Location).Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile native Windows target
        working-directory: vendor/pokeplatinum-native
        run: .\Launch_MSys2.ps1 "GITHUB_ACTIONS= make win64"
        shell: powershell
      - name: Verify complete Windows runtime package
        shell: pwsh
        run: python (Join-Path $env:GITHUB_WORKSPACE "scripts/verify_native_package.py") --build-dir (Join-Path $env:GITHUB_WORKSPACE "vendor/pokeplatinum-native/build_win64") --package-dir (Join-Path $env:GITHUB_WORKSPACE "vendor/pokeplatinum-native/build_win64/pokeplatinum") --filesys-csv (Join-Path $env:GITHUB_WORKSPACE "vendor/pokeplatinum-native/platinum.us/filesys.csv")
      - name: Confirm Windows executable is included
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "vendor/pokeplatinum-native/build_win64/pokeplatinum"
          $executables = @(Get-ChildItem -LiteralPath $packageDir -Recurse -File -Filter "*.exe")
          if ($executables.Count -eq 0) {
            throw "No .exe was found in the verified Windows runtime package."
          }
          $executables | ForEach-Object { Write-Host ("Windows executable: " + $_.FullName) }

      - name: Stage Windows executable and DLLs without game data
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "vendor/pokeplatinum-native/build_win64/pokeplatinum"
          $stageDir = Join-Path $env:RUNNER_TEMP "Platina-Reluzente-Windows-x64"
          if (Test-Path -LiteralPath $stageDir) {
            Remove-Item -LiteralPath $stageDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          $nativeFiles = @(Get-ChildItem -LiteralPath $packageDir -Recurse -File | Where-Object { $_.Extension -in @(".exe", ".dll") })
          $executables = @($nativeFiles | Where-Object { $_.Extension -eq ".exe" })
          if ($executables.Count -eq 0) {
            throw "No Windows executable was available for artifact staging."
          }
          foreach ($file in $nativeFiles) {
            $relativePath = [System.IO.Path]::GetRelativePath($packageDir, $file.FullName)
            $destination = Join-Path $stageDir $relativePath
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $destination
          }
          $csvPath = Join-Path $env:GITHUB_WORKSPACE "vendor/pokeplatinum-native/platinum.us/filesys.csv"
          $pathManifestScript = Join-Path $env:GITHUB_WORKSPACE "launcher-app/scripts/create-data-path-manifest.cjs"
          $pathManifest = Join-Path $stageDir "platinum-data-paths.txt"
          node $pathManifestScript --input $csvPath --output $pathManifest
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $pathManifest -PathType Leaf)) {
            throw "Failed to generate the extracted-data path-only manifest."
          }
          @"
          Platina Reluzente - native Windows x64 executable test build

          This artifact contains native executable(s), DLL dependencies and a
          path-only manifest of expected local game files. It excludes ROMs,
          firmware, extracted game resources, saves, patches, and localization
          files. A legally obtained compatible ROM must be supplied locally.
          Startup and gameplay have not yet been verified with a ROM.
          "@ | Set-Content -LiteralPath (Join-Path $stageDir "README-FIRST-START.txt") -Encoding utf8
          $hashLines = @(
            Get-ChildItem -LiteralPath $stageDir -Recurse -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object FullName |
            ForEach-Object {
              $relativePath = [System.IO.Path]::GetRelativePath($stageDir, $_.FullName) -replace '\\', '/'
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relativePath"
            }
          )
          $hashLines | Set-Content -LiteralPath (Join-Path $stageDir "SHA256SUMS.txt") -Encoding ascii
          Write-Host "Staged $($executables.Count) executable(s) and $(@($nativeFiles | Where-Object { $_.Extension -eq '.dll' }).Count) DLL(s). No game resource files were staged."
      - name: Upload Windows x64 native executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Platina-Reluzente-Windows-x64-native
          path: ${{ runner.temp }}/Platina-Reluzente-Windows-x64/
          if-no-files-found: error
          retention-days: 14
      - name: Restore Meson dependency references
        if: always()
        shell: pwsh
        run: python (Join-Path $env:GITHUB_WORKSPACE "scripts/pin_native_dependencies.py") --restore (Join-Path $env:GITHUB_WORKSPACE "vendor/pokeplatinum-native")

      - name: Set up Node.js for Windows launcher
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install Windows launcher dependencies
        working-directory: launcher-app
        run: npm install --no-audit --no-fund
      - name: Test Windows launcher before packaging
        working-directory: launcher-app
        run: npm test
      - name: Build integrated Windows launcher
        working-directory: launcher-app
        run: npm run build:windows
      - name: Stage Windows launcher artifact without game data
        shell: pwsh
        run: |
          $distDir = Join-Path $env:GITHUB_WORKSPACE "launcher-app/dist"
          $stageDir = Join-Path $env:RUNNER_TEMP "Platina-Reluzente-Launcher-Windows-x64"
          $launchers = @(Get-ChildItem -LiteralPath $distDir -File -Filter "Platina-Reluzente-Launcher-*-windows-x64.exe")
          if ($launchers.Count -ne 1 -or $launchers[0].Length -le 0) {
            throw "Expected exactly one non-empty integrated Windows x64 launcher; found $($launchers.Count)."
          }
          if (Test-Path -LiteralPath $stageDir) {
            Remove-Item -LiteralPath $stageDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item -LiteralPath $launchers[0].FullName -Destination $stageDir
          @"
          Platina Reluzente Launcher - Windows x64 test build

          This is a native desktop launcher package. Its game runtime is compiled
          native code and bundled libraries; no ROM, firmware, extracted NARC,
          game save, or patch is included.

          Import only a legally obtained compatible Pokemon Platinum USA Rev. 1
          .nds image through the launcher. The current loader checks the full
          image SHA-1 and rejects unsupported revisions. Missing data is meant
          to be extracted locally from the imported ROM on first launch.

          This is an experimental test build. Linux CI confirms the native
          window opens without a ROM, but CI has not confirmed gameplay with a
          ROM. Please report any failure and attach the private native-startup.log;
          do not upload ROMs or extracted data.
          "@ | Set-Content -LiteralPath (Join-Path $stageDir "README-FIRST-START.txt") -Encoding utf8
          $hashLines = @(
            Get-ChildItem -LiteralPath $stageDir -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          )
          $hashLines | Set-Content -LiteralPath (Join-Path $stageDir "SHA256SUMS.txt") -Encoding ascii
          Get-ChildItem -LiteralPath $stageDir -File | Select-Object Name, Length
      - name: Upload integrated Windows launcher
        uses: actions/upload-artifact@v4
        with:
          name: Platina-Reluzente-Launcher-Windows-x64
          path: ${{ runner.temp }}/Platina-Reluzente-Launcher-Windows-x64/
          if-no-files-found: error
          retention-days: 14


# CI uploads short-lived executable-only artifacts after validation. It never uploads ROMs or extracted game resources.
# The Linux AppImage bundles the compiled application and its libraries; Windows artifacts contain only .exe/.dll files plus notices/checksums.
