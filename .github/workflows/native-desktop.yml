name: Native desktop build and localization checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  NATIVE_SOURCE_COMMIT: 35067868f64f23d25d17ac3e536cfdd9a7f40523
  NATIVE_SOURCE_URL: https://github.com/cybervisi0n/pokeplatinum.git

jobs:
  localization-importer:
    name: Importer and dependency-pinning unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m py_compile tools/import_localization.py scripts/pin_native_dependencies.py tools/tests/test_import_localization.py tools/tests/test_pin_native_dependencies.py
      - name: Run unit tests
        run: python -m unittest discover -s tools/tests -v

  linux:
    name: Linux x86-64 compile
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LM_LICENSE_FILE: ${{ github.workspace }}/vendor/pokeplatinum-native/tools/cw/license.dat
      BUILD: /var/tmp/pokeplatinum
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Checkout pinned native source with standalone Git metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          native_dir="$GITHUB_WORKSPACE/vendor/pokeplatinum-native"
          rm -rf "$native_dir"
          mkdir -p "$native_dir"
          git -C "$native_dir" init
          git -C "$native_dir" remote add origin "$NATIVE_SOURCE_URL"
          git -C "$native_dir" fetch --depth=1 origin "$NATIVE_SOURCE_COMMIT"
          git -C "$native_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$native_dir" rev-parse HEAD)" = "$NATIVE_SOURCE_COMMIT"
      - name: Pin Meson dependency commits
        run: python "$GITHUB_WORKSPACE/scripts/pin_native_dependencies.py" "$GITHUB_WORKSPACE/vendor/pokeplatinum-native"
      - name: Install runner utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse git python3 wget zip
      - name: Install build toolchain
        working-directory: vendor/pokeplatinum-native
        run: ./drun.sh make skrew
      - name: Compile native Linux target
        working-directory: vendor/pokeplatinum-native
        run: ./drun.sh make linux

  windows:
    name: Windows x64 compile
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Checkout pinned native source with standalone Git metadata
        shell: pwsh
        run: |
          $nativeDir = Join-Path $env:GITHUB_WORKSPACE "vendor/pokeplatinum-native"
          if (Test-Path $nativeDir) {
            Remove-Item -Recurse -Force $nativeDir
          }
          New-Item -ItemType Directory -Path $nativeDir -Force | Out-Null
          git -C $nativeDir init
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $nativeDir remote add origin $env:NATIVE_SOURCE_URL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $nativeDir fetch --depth=1 origin $env:NATIVE_SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $nativeDir checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (git -C $nativeDir rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:NATIVE_SOURCE_COMMIT) {
            throw "Native source commit mismatch. Expected $env:NATIVE_SOURCE_COMMIT; got $actual"
          }
      - name: Pin Meson dependency commits
        shell: pwsh
        run: |
          python (Join-Path $env:GITHUB_WORKSPACE "scripts/pin_native_dependencies.py") (Join-Path $env:GITHUB_WORKSPACE "vendor/pokeplatinum-native")
      - name: Install MSYS2 build environment
        working-directory: vendor/pokeplatinum-native
        run: .\Install_MSys2.ps1
        shell: powershell
      - name: Compile native Windows target
        working-directory: vendor/pokeplatinum-native
        run: .\Launch_MSys2.ps1 "make win64"
        shell: powershell

# CI compiles source and tests local maintenance tools only. It intentionally
# does not upload executables, ROMs, extracted NARC files, or game assets.
