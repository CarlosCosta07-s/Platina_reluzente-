name: Native desktop build and localization checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization-importer:
    name: Localizer parser unit tests (no ROM required)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m py_compile tools/import_localization.py tools/tests/test_import_localization.py
      - name: Run parser unit tests
        run: python -m unittest discover -s tools/tests -v

  linux:
    name: Linux x86-64 compile
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LM_LICENSE_FILE: ${{ github.workspace }}/vendor/pokeplatinum-native/tools/cw/license.dat
      BUILD: /var/tmp/pokeplatinum
    defaults:
      run:
        working-directory: vendor/pokeplatinum-native
    steps:
      - name: Checkout main and pinned source
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install runner utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse git python3 wget zip
      - name: Install build toolchain
        run: ./drun.sh make skrew
      - name: Compile native Linux target
        run: ./drun.sh make linux

  windows:
    name: Windows x64 compile
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vendor/pokeplatinum-native
    steps:
      - name: Checkout main and pinned source
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install MSYS2 build environment
        run: .\Install_MSys2.ps1
        shell: powershell
      - name: Compile native Windows target
        run: .\Launch_Msys2.ps1 "make win64"
        shell: powershell

# CI runs source-level parser tests and compiles the upstream native code.
# It intentionally does not upload executables, ROMs, extracted NARC files,
# or compiled game assets.
