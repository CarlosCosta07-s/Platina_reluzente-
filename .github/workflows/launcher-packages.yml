name: Launcher packages for manual testing

concurrency:
  group: launcher-packages-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "launcher-app/**"
      - ".github/workflows/launcher-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Launcher source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install launcher dependencies
        working-directory: launcher-app
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        working-directory: launcher-app
        run: npm test

  windows:
    name: Build Windows launcher EXE
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: launcher-app
        run: npm install --no-audit --no-fund
      - name: Build portable EXE
        working-directory: launcher-app
        run: npm run build:windows
      - name: Upload Windows launcher
        uses: actions/upload-artifact@v4
        with:
          name: platina-reluzente-launcher-windows-x64
          path: launcher-app/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Build Linux launcher AppImage and tarball
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: launcher-app
        run: npm install --no-audit --no-fund
      - name: Build AppImage and tarball
        working-directory: launcher-app
        run: npm run build:linux
      - name: Upload Linux launcher
        uses: actions/upload-artifact@v4
        with:
          name: platina-reluzente-launcher-linux-x86_64
          path: launcher-app/dist/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android launcher APK
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [[ ! -d "$sdk_root/cmdline-tools" ]]; then
            echo "Android command-line tools were not found under $sdk_root" >&2
            exit 1
          fi
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$sdkmanager_path" ]]; then
            echo "sdkmanager executable was not found." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$sdkmanager_path" --licenses
          set -o pipefail
          "$sdkmanager_path" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Install launcher dependencies
        working-directory: launcher-app
        run: npm install --no-audit --no-fund
      - name: Generate Capacitor Android project
        working-directory: launcher-app
        run: npx cap add android
      - name: Sync local web launcher into Android project
        working-directory: launcher-app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: launcher-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Name Android test APK
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p launcher-app/dist
          cp launcher-app/android/app/build/outputs/apk/debug/app-debug.apk launcher-app/dist/Platina-Reluzente-Launcher-Android-debug.apk
          test -s launcher-app/dist/Platina-Reluzente-Launcher-Android-debug.apk
      - name: Upload Android launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: platina-reluzente-launcher-android-apk
          path: launcher-app/dist/Platina-Reluzente-Launcher-Android-debug.apk
          if-no-files-found: error
          retention-days: 14
