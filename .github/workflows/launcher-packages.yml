name: Launcher packages for manual testing

concurrency:
  group: launcher-packages-v3-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

on:
  workflow_run:
    workflows:
      - Native desktop build and localization checks
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  verify-platform-builds:
    name: Require Windows, Linux and Android to pass on the same commit
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      ready: ${{ steps.find.outputs.ready }}
      desktop_run_id: ${{ steps.find.outputs.desktop_run_id }}
      android_run_id: ${{ steps.find.outputs.android_run_id }}
      head_sha: ${{ steps.find.outputs.head_sha }}
    steps:
      - name: Find successful platform builds for the same commit
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            const desktop = context.payload.workflow_run;
            if (desktop.name !== 'Native desktop build and localization checks' ||
                desktop.head_branch !== 'main' || desktop.status !== 'completed' ||
                desktop.conclusion !== 'success') {
              core.setFailed('Packages require a successful Windows+Linux build from main.');
              return;
            }

            const sha = desktop.head_sha;
            core.setOutput('head_sha', sha);
            core.setOutput('desktop_run_id', String(desktop.id));

            const deadline = Date.now() + 95 * 60 * 1000;
            const sleep = (milliseconds) => new Promise(resolve => setTimeout(resolve, milliseconds));
            while (Date.now() < deadline) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                per_page: 100
              });
              const candidates = response.data.workflow_runs
                .filter(run => run.name === 'Android native ARM64 cross-build' &&
                  run.head_sha === sha && run.head_branch === 'main')
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
              const android = candidates[0];

              if (android && android.status === 'completed') {
                if (android.conclusion !== 'success') {
                  core.setFailed('Android native build for commit ' + sha +
                    ' concluded ' + android.conclusion + '. No cross-platform packages were published.');
                  return;
                }
                core.setOutput('android_run_id', String(android.id));
                core.setOutput('ready', 'true');
                core.info('Windows and Linux passed in desktop run ' + desktop.id +
                  '; Android passed in run ' + android.id + ' for the same commit ' + sha + '.');
                return;
              }

              core.info(android
                ? 'Waiting for Android build ' + android.id + ' (status: ' + android.status + ') on ' + sha
                : 'Waiting for the Android build to start on commit ' + sha);
              await sleep(30000);
            }

            core.setFailed('Timed out waiting for the matching Android build. No cross-platform packages were published.');

  launcher-source-checks:
    name: Launcher source checks
    needs: verify-platform-builds
    if: ${{ needs.verify-platform-builds.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-platform-builds.outputs.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install launcher dependencies
        working-directory: launcher-app
        run: npm install --no-audit --no-fund
      - name: Run launcher tests
        working-directory: launcher-app
        run: npm test

  windows:
    name: Windows launcher with bundled native runtime
    needs: [verify-platform-builds, launcher-source-checks]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-platform-builds.outputs.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Download native Windows runtime
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-platform-builds.outputs.desktop_run_id }}
          name: platina-reluzente-windows-x64
          path: launcher-app/runtime
      - name: Verify included executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'launcher-app/runtime/main.exe')) { throw 'main.exe missing; refusing to package a launcher that asks users to select an executable.' }
      - name: Install launcher dependencies
        working-directory: launcher-app
        run: npm install --no-audit --no-fund
      - name: Build complete Windows package
        working-directory: launcher-app
        run: npm run build:windows
      - name: Upload complete Windows package
        uses: actions/upload-artifact@v4
        with:
          name: platina-reluzente-windows-x64-complete
          path: launcher-app/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux launcher with bundled native runtime
    needs: [verify-platform-builds, launcher-source-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-platform-builds.outputs.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Download native Linux runtime archive
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-platform-builds.outputs.desktop_run_id }}
          name: platina-reluzente-linux-x86_64
          path: launcher-app/runtime-archive
      - name: Extract and verify included executable
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p launcher-app/runtime
          tar -xzf launcher-app/runtime-archive/Platina-Reluzente-Linux-x86_64.tar.gz -C launcher-app/runtime
          test -s launcher-app/runtime/main
          chmod +x launcher-app/runtime/main
          test -x launcher-app/runtime/main
      - name: Install launcher dependencies
        working-directory: launcher-app
        run: npm install --no-audit --no-fund
      - name: Build complete Linux package
        working-directory: launcher-app
        run: npm run build:linux
      - name: Upload complete Linux package
        uses: actions/upload-artifact@v4
        with:
          name: platina-reluzente-linux-x86_64-complete
          path: launcher-app/dist/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: One Android APK with ROM importer and bundled native runtime
    needs: [verify-platform-builds, launcher-source-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-platform-builds.outputs.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$sdk_root/cmdline-tools"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager_path"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$sdkmanager_path" --licenses
          set -o pipefail
          "$sdkmanager_path" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Install launcher dependencies
        working-directory: launcher-app
        run: npm install --no-audit --no-fund
      - name: Build web assets and generate Capacitor Android project
        working-directory: launcher-app
        run: |
          npm run build:web
          npx cap add android
      - name: Sync Capacitor Filesystem plugin
        working-directory: launcher-app
        run: npx cap sync android
      - name: Download native Android runtime and game data from matching build
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-platform-builds.outputs.android_run_id }}
          name: platina-reluzente-android-arm64-native-libs
          path: launcher-app/dist/native-game
      - name: Integrate SDL runtime into the ROM launcher
        working-directory: launcher-app
        run: node scripts/integrate-android-runtime.cjs --project android --runtime-artifact dist/native-game
      - name: Build the single integrated Android APK
        working-directory: launcher-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Verify the combined APK includes runtime, assets and ROM importer
        shell: bash
        run: |
          set -Eeuo pipefail
          apk=launcher-app/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          zipinfo -1 "$apk" | grep -Fx 'lib/arm64-v8a/libmain.so'
          zipinfo -1 "$apk" | grep -Fx 'lib/arm64-v8a/libSDL2.so'
          zipinfo -1 "$apk" | grep -Fx 'lib/arm64-v8a/libc++_shared.so'
          zipinfo -1 "$apk" | grep -Fx 'assets/pokeplatinum/header.bin'
          zipinfo -1 "$apk" | grep -Fx 'assets/pokeplatinum/firmware.bin'
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          mkdir -p launcher-app/dist
          cp "$apk" launcher-app/dist/Platina-Reluzente-Android-arm64-complete.apk
      - name: Upload the single integrated Android APK
        uses: actions/upload-artifact@v4
        with:
          name: platina-reluzente-android-arm64-complete
          path: launcher-app/dist/Platina-Reluzente-Android-arm64-complete.apk
          if-no-files-found: error
          retention-days: 14
